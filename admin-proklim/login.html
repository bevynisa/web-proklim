<meta charset="UTF-8">
<title>Masuk — Admin ProKlim Desa Sanggang</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=10">

<div class="layar-masuk">
  <div class="kotak-masuk">
    <h1>Admin ProKlim Desa Sanggang</h1>
    <p class="sub">Masuk untuk mengelola isi website</p>

    <div id="pita-pratinjau" class="pita-pratinjau" style="display:none">
      Mode Pratinjau — belum tersambung ke database sungguhan. Isi email &amp; kata sandi apa saja untuk melihat tampilan dasbor.
    </div>

    <form id="form-masuk">
      <div class="field">
        <label for="in-email">Email</label>
        <input type="email" id="in-email" placeholder="nama@contoh.com" required>
      </div>
      <div class="field">
        <label for="in-sandi">Kata Sandi</label>
        <input type="password" id="in-sandi" required>
      </div>
      <button type="submit" class="tombol tombol-utama" style="width:100%;justify-content:center" id="btn-masuk">Masuk</button>
      <p id="pesan-gagal" class="hint" style="color:#D64545;display:none;margin-top:10px"></p>
    </form>
  </div>
</div>
<div id="pesan-mengambang"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/supabase-client.js?v=3"></script>
<script src="assets/js/ui.js?v=3"></script>
<script src="assets/js/auth.js?v=3"></script>
<script>
  (async function () {
    if (!window.SupabaseClient.tersambung) document.getElementById("pita-pratinjau").style.display = "";
    if (await Auth.sedangMasuk()) { window.location.href = "index.html"; return; }

    document.getElementById("form-masuk").addEventListener("submit", async function (e) {
      e.preventDefault();
      var tombol = document.getElementById("btn-masuk");
      var pesanGagal = document.getElementById("pesan-gagal");
      pesanGagal.style.display = "none";
      tombol.disabled = true;
      tombol.textContent = "Memeriksa...";
      var hasil = await Auth.masuk(document.getElementById("in-email").value.trim(), document.getElementById("in-sandi").value);
      if (hasil.ok) {
        window.location.href = "index.html";
      } else {
        pesanGagal.textContent = hasil.pesan;
        pesanGagal.style.display = "";
        tombol.disabled = false;
        tombol.textContent = "Masuk";
      }
    });
  })();
</script>
